name: Optional LightGBM adapter CI

on:
  push:
    branches: ["work/**", "integration/**"]
    paths:
      - "src/demand_forecast_kit/models/lightgbm.py"
      - "tests/test_optional_models.py"
      - "pyproject.toml"
      - ".github/workflows/lightgbm-adapter.yml"
  pull_request:
    branches: ["integration/**"]
    paths:
      - "src/demand_forecast_kit/models/lightgbm.py"
      - "tests/test_optional_models.py"
      - "pyproject.toml"
      - ".github/workflows/lightgbm-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lightgbm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,lightgbm]"
      - run: ruff check src/demand_forecast_kit/models tests/test_optional_models.py
      - run: ruff format --check src/demand_forecast_kit/models tests/test_optional_models.py
      - run: pyright
      - run: pytest --no-cov tests/test_optional_models.py
      - run: python evals/run_lightgbm_smoke.py --output artifacts/lightgbm-rolling-origin.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightgbm-rolling-origin-evaluation
          path: artifacts/lightgbm-rolling-origin.json
          if-no-files-found: error
          retention-days: 14
      - run: pip-audit --skip-editable
      - run: reuse lint
