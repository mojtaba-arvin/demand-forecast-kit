name: Optional LightGBM adapter CI

on:
  push:
    branches: ["work/**", "integration/**"]
    paths:
      - "src/demand_forecast_kit/models/lightgbm.py"
      - "tests/test_optional_models.py"
      - "pyproject.toml"
      - ".github/workflows/lightgbm-adapter.yml"
  pull_request:
    branches: ["integration/**"]
    paths:
      - "src/demand_forecast_kit/models/lightgbm.py"
      - "tests/test_optional_models.py"
      - "pyproject.toml"
      - ".github/workflows/lightgbm-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: \${{ github.workflow }}-\${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lightgbm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,lightgbm]"
      - run: ruff check src/demand_forecast_kit/models tests/test_optional_models.py
      - run: ruff format --check src/demand_forecast_kit/models tests/test_optional_models.py
      - run: pyright
      - run: pytest tests/test_optional_models.py
