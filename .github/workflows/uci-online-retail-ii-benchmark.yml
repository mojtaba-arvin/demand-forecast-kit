name: UCI Online Retail II independent retail benchmark

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/uci-online-retail-ii-benchmark.yml"
      - "evals/run_uci_online_retail_ii_benchmark.py"
      - "src/demand_forecast_kit/retail_benchmark.py"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      max_skus_per_cohort:
        description: "Deterministic SKU sample per demand cohort"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: uci-online-retail-ii-benchmark-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect independent-retail benchmark changes
    runs-on: ubuntu-latest
    outputs:
      run_benchmark: ${{ steps.filter.outputs.run_benchmark }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Decide whether the benchmark is relevant
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            base="$BEFORE_SHA"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA" || true)"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "run_benchmark=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "$HEAD_SHA")"
          run_benchmark=false
          while IFS= read -r path; do
            case "$path" in
              evals/run_uci_online_retail_ii_benchmark.py|src/demand_forecast_kit/retail_benchmark.py|pyproject.toml)
                run_benchmark=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "run_benchmark=$run_benchmark" >> "$GITHUB_OUTPUT"
          echo "Independent-retail benchmark required: $run_benchmark"

  benchmark:
    needs: detect
    if: needs.detect.outputs.run_benchmark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[benchmark,dev]"
      - name: Download official UCI workbook
        run: |
          mkdir -p data/uci-online-retail-ii
          curl --fail --location --retry 3 \
            "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip" \
            --output /tmp/online-retail-ii.zip
          unzip -o /tmp/online-retail-ii.zip -d data/uci-online-retail-ii
          find data/uci-online-retail-ii -iname "online_retail_II.xlsx" -print -quit | grep .
      - name: Run independent retail benchmark
        run: |
          workbook="$(find data/uci-online-retail-ii -iname 'online_retail_II.xlsx' -print -quit)"
          python evals/run_uci_online_retail_ii_benchmark.py "$workbook" \
            --max-skus-per-cohort "${{ inputs.max_skus_per_cohort || '20' }}" \
            --output artifacts/uci-online-retail-ii-benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uci-online-retail-ii-benchmark
          path: artifacts/uci-online-retail-ii-benchmark.json
          if-no-files-found: error
          retention-days: 30
