name: Inspect independent stock-aware retail source

on:
  workflow_dispatch:
  push:
    branches:
      - work/zenodo-retail-source-inspection

permissions:
  contents: read

concurrency:
  group: retail-source-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install inspection dependencies
        run: python -m pip install polars pyarrow requests

      - name: Inspect the public Zenodo release
        run: |
          python scripts/inspect_zenodo_retail_source.py \
            --record-id 19784493 \
            --output artifacts/zenodo-retail-source-inspection.json

      - name: Upload schema and provenance report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zenodo-retail-source-inspection
          path: artifacts/zenodo-retail-source-inspection.json
          if-no-files-found: error
          retention-days: 14
