name: UCI Electricity independent benchmark

on:
  push:
    branches: ["work/parallel-e-evaluation"]
    paths:
      - "evals/run_uci_electricity_benchmark.py"
      - "src/demand_forecast_kit/datasets.py"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      max_series:
        description: "Number of deterministic client series (1–370)"
        required: true
        default: "370"
        type: string

permissions:
  contents: read

concurrency:
  group: uci-electricity-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[benchmark,dev]"
      - name: Download official UCI dataset
        run: |
          mkdir -p data/uci-electricity
          curl --fail --location --retry 3 \
            "https://archive.ics.uci.edu/ml/machine-learning-databases/00321/LD2011_2014.txt.zip" \
            --output /tmp/uci-electricity.zip
          unzip -o /tmp/uci-electricity.zip -d data/uci-electricity
          test -s data/uci-electricity/LD2011_2014.txt
      - name: Run independent benchmark
        run: |
          python evals/run_uci_electricity_benchmark.py \
            data/uci-electricity/LD2011_2014.txt \
            --max-series "${{ inputs.max_series || '370' }}" \
            --output artifacts/uci-electricity-benchmark.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uci-electricity-benchmark
          path: artifacts/uci-electricity-benchmark.json
          if-no-files-found: error
          retention-days: 30
