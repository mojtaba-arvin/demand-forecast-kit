name: Statistical adapter CI

on:
  push:
    branches: ["main", "work/**", "integration/**"]
    paths:
      - "pyproject.toml"
      - "src/demand_forecast_kit/models/statistical.py"
      - "tests/test_statistical_*.py"
      - "evals/run_statistical_smoke.py"
      - "evals/run_uci_online_retail_benchmark.py"
      - "evals/run_uci_online_retail_ii_benchmark.py"
      - "src/demand_forecast_kit/retail_benchmark.py"
  pull_request:
    branches: ["main", "work/**"]
    paths:
      - "pyproject.toml"
      - "src/demand_forecast_kit/models/statistical.py"
      - "tests/test_statistical_*.py"
      - "evals/run_statistical_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  statistical-integration:
    name: Optional StatsForecast adapter integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package, StatsForecast, and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,stats]"

      - name: Run StatsForecast adapter integration tests
        run: pytest tests/test_statistical_adapters.py --no-cov

      - name: Run dense and intermittent rolling-origin comparisons
        run: python evals/run_statistical_smoke.py

      - name: Upload statistical evaluation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: statistical-adapter-evaluation
          path: artifacts/*-statistical-adapter-evaluation.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit statistical dependency set
        run: pip-audit --skip-editable
