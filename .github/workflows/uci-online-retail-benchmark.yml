name: UCI Online Retail real-data benchmark

on:
  push:
    branches: ["work/uci-real-data-benchmark", "work/evaluation-infrastructure"]
    paths:
      - ".github/workflows/uci-online-retail-benchmark.yml"
      - "evals/run_uci_online_retail_benchmark.py"
      - "evals/run_uci_online_retail_e2e.py"
      - "src/demand_forecast_kit/retail_benchmark.py"
      - "src/demand_forecast_kit/backtesting.py"
      - "src/demand_forecast_kit/contracts.py"
      - "src/demand_forecast_kit/lead_time.py"
      - "src/demand_forecast_kit/inventory.py"
      - "src/demand_forecast_kit/policy_comparison.py"
      - "src/demand_forecast_kit/decisions.py"
      - "src/demand_forecast_kit/simulation.py"
      - "src/demand_forecast_kit/registry.py"
      - "src/demand_forecast_kit/artifacts.py"
      - "src/demand_forecast_kit/models/seasonal_naive.py"
      - "src/demand_forecast_kit/models/statistical.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uci-online-retail-benchmark-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Real-data lead-time calibration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out benchmark code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[benchmark]"

      - name: Download the official UCI dataset archive
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 --connect-timeout 30 \
            "https://archive.ics.uci.edu/static/public/352/online+retail.zip" \
            --output /tmp/uci-online-retail.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("/tmp/uci-online-retail.zip")
          with ZipFile(archive) as bundle:
              matches = [
                  name for name in bundle.namelist()
                  if Path(name).name.casefold() == "online retail.xlsx"
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected one Online Retail.xlsx in UCI archive, found: {matches}"
                  )
              member = matches[0]
              target = Path("data/raw/Online Retail.xlsx")
              target.write_bytes(bundle.read(member))
          print(f"Extracted {target} ({target.stat().st_size:,} bytes)")
          PY

      - name: Run real-data forecast-to-inventory decision pipeline
        run: |
          python evals/run_uci_online_retail_e2e.py \
            "data/raw/Online Retail.xlsx" \
            --origin-offset-days 300 \
            --output artifacts/uci-online-retail-end-to-end.json

      - name: Upload real-data end-to-end decision
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uci-online-retail-end-to-end-decision
          path: |
            artifacts/uci-online-retail-end-to-end.json
            artifacts/uci-online-retail-runs.sqlite
            artifacts/uci-online-retail-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Run real-data calibration benchmark
        run: |
          python evals/run_uci_online_retail_benchmark.py \
            "data/raw/Online Retail.xlsx" \
            --max-skus-per-cohort 10 \
            --output artifacts/uci-online-retail-calibration.json

      - name: Upload reproducible benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uci-online-retail-real-data-benchmark
          path: artifacts/uci-online-retail-calibration.json
          if-no-files-found: error
          retention-days: 30
