name: Reproducible performance benchmarks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: "Workload size"
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke
      repeats:
        description: "Repeated measurements (minimum 3)"
        required: true
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: performance-benchmarks-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,benchmarks]"
      - name: Run reproducible offline workloads
        env:
          PROFILE: \${{ inputs.profile || 'smoke' }}
          REPEATS: \${{ inputs.repeats || 5 }}
        run: python bench/run_benchmarks.py --profile "$PROFILE" --repeats "$REPEATS" --output artifacts/performance-baseline.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-\${{ inputs.profile || 'smoke' }}-\${{ github.sha }}
          path: artifacts/performance-baseline.json
          if-no-files-found: error
          retention-days: 30
