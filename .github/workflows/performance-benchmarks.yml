name: Reproducible performance benchmarks

on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: ["integration/**"]
    paths:
      - "bench/**"
      - "tests/test_benchmark_comparison.py"
      - "pyproject.toml"
      - ".github/workflows/performance-benchmarks.yml"
  pull_request:
    branches: ["integration/**"]
    paths:
      - "bench/**"
      - "tests/test_benchmark_comparison.py"
      - "pyproject.toml"
      - ".github/workflows/performance-benchmarks.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Workload size"
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke
      repeats:
        description: "Repeated measurements per workload (minimum 3)"
        required: true
        type: number
        default: 5
      runner_class:
        description: "Use the dedicated reference runner for baseline calibration"
        required: true
        type: choice
        options:
          - github-hosted
          - reference-self-hosted
        default: github-hosted

permissions:
  contents: read

concurrency:
  group: performance-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: \${{ github.event_name == 'workflow_dispatch' && inputs.runner_class == 'reference-self-hosted' && fromJSON('["self-hosted","linux","x64","demand-forecast-reference"]') || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,api,api-test,benchmark]"
      - name: Run reproducible offline workloads
        env:
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}
          REPEATS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeats || 5 }}
        run: python bench/run_benchmarks.py --profile "$PROFILE" --repeats "$REPEATS" --output artifacts/performance-baseline.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}-${{ github.sha }}
          path: artifacts/performance-baseline.json
          if-no-files-found: error
          retention-days: 90
