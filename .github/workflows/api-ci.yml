name: Optional API integration

on:
  push:
    branches: ["work/**"]
    paths:
      - "src/demand_forecast_kit/api.py"
      - "tests/test_api.py"
      - "pyproject.toml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: ["main", "work/**", "integration/**"]
    paths:
      - "src/demand_forecast_kit/api.py"
      - "tests/test_api.py"
      - "pyproject.toml"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install API test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,api,api-test]"
      - name: Run API integration tests
        run: pytest tests/test_api.py --no-cov
      - name: Type check API module
        run: pyright src/demand_forecast_kit/api.py
