name: CI

on:
  push:
    branches: ["main", "work/**", "integration/**"]
  pull_request:
    branches: ["main", "work/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,api,api-test]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Show validator formatter diff (diagnostic)
        if: always()
        run: ruff format --diff scripts/check_commit_identity.py || true


      - name: Strict type check
        run: pyright

      - name: Test with coverage
        run: pytest

      - name: Generate deterministic synthetic evaluation
        run: python evals/run_synthetic_smoke.py

      - name: Generate synthetic per-series routing artifact
        run: python evals/run_routing_smoke.py

      - name: Upload routing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-model-routing-report
          path: artifacts/synthetic-model-routing.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate synthetic inventory policy evaluation
        run: python evals/run_inventory_smoke.py

      - name: Generate synthetic lead-time calibration evaluation
        run: python evals/run_lead_time_calibration_smoke.py

      - name: Generate end-to-end forecast and inventory decision
        run: python evals/run_end_to_end_smoke.py

      - name: Upload lead-time calibration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-lead-time-calibration
          path: artifacts/synthetic-lead-time-calibration.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload end-to-end decision artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-end-to-end-decision
          path: artifacts/synthetic-end-to-end-decision.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload inventory evaluation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-inventory-evaluation
          path: artifacts/synthetic-inventory-evaluation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload evaluation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-evaluation-report
          path: artifacts/synthetic-baseline-evaluation.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit Python dependencies
        run: pip-audit --skip-editable

      - name: Check REUSE compliance
        run: reuse lint


  packaging:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install built wheel and smoke-test entry points
        run: |
          python -m venv .venv-package-smoke
          .venv-package-smoke/bin/python -m pip install dist/*.whl
          .venv-package-smoke/bin/demand-forecast --help
          .venv-package-smoke/bin/demand-forecast-evaluate --help
          .venv-package-smoke/bin/python -c "import demand_forecast_kit; print(demand_forecast_kit.__version__)"

  restic-recovery:
    name: Restic backup and restore integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Restic and pytest
        run: |
          sudo apt-get update
          sudo apt-get install --yes restic
          python -m pip install pytest

      - name: Verify systemd backup service and timer units
        run: |
          command -v systemd-analyze
          sudo install -d -m 0755 /opt/demand-forecast-kit/scripts
          sudo install -d -m 0700 /etc/demand-forecast-kit
          sudo install -m 0755 scripts/backup-restic.sh /opt/demand-forecast-kit/scripts/backup-restic.sh
          sudo install -m 0644 deploy/systemd/demand-forecast-backup.service /etc/systemd/system/
          sudo install -m 0644 deploy/systemd/demand-forecast-backup.timer /etc/systemd/system/
          sudo touch /etc/demand-forecast-kit/restic.env
          sudo systemd-analyze verify \
            /etc/systemd/system/demand-forecast-backup.service \
            /etc/systemd/system/demand-forecast-backup.timer

      - name: Exercise encrypted backup and restore scripts
        run: python -m pytest -o addopts='' -q tests/test_restic_recovery.py
