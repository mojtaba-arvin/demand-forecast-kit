name: CI

on:
  push:
    branches: ["main", "work/**", "integration/**"]
  pull_request:
    branches: ["main", "work/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,api,api-test]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Strict type check
        run: pyright

      - name: Test with coverage
        run: pytest

      - name: Generate deterministic synthetic evaluation
        run: python evals/run_synthetic_smoke.py

      - name: Generate synthetic per-series routing artifact
        run: python evals/run_routing_smoke.py

      - name: Upload routing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-model-routing-report
          path: artifacts/synthetic-model-routing.json
          if-no-files-found: error
          retention-days: 14

      - name: Generate synthetic inventory policy evaluation
        run: python evals/run_inventory_smoke.py

      - name: Generate synthetic lead-time calibration evaluation
        run: python evals/run_lead_time_calibration_smoke.py

      - name: Upload lead-time calibration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-lead-time-calibration
          path: artifacts/synthetic-lead-time-calibration.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload inventory evaluation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-inventory-evaluation
          path: artifacts/synthetic-inventory-evaluation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload evaluation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-evaluation-report
          path: artifacts/synthetic-baseline-evaluation.json
          if-no-files-found: error
          retention-days: 14

      - name: Audit Python dependencies
        run: pip-audit --skip-editable

      - name: Check REUSE compliance
        run: reuse lint
