name: Release candidate

on:
  push:
    branches: ["work/parallel-i-release"]
    tags: ["v*"]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "tests/**"
      - "evals/**"
      - ".github/workflows/release-candidate.yml"
  pull_request:
    branches: ["main", "work/**", "integration/**"]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "tests/**"
      - "evals/**"
      - ".github/workflows/release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tooling and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev,stats]"
      - name: Run source quality gates
        run: |
          ruff check .
          ruff format --check .
          pyright
          pytest
          pytest tests/test_statistical_adapters.py --no-cov
          python evals/run_statistical_smoke.py
          if [ -f tests/test_api.py ]; then
            python -m pip install -e ".[api,api-test]"
            pytest tests/test_api.py --no-cov
          fi
          reuse lint
          pip-audit --skip-editable
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/demand-forecast-release
          /tmp/demand-forecast-release/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/demand-forecast-release/bin/python -c "import demand_forecast_kit; print(demand_forecast_kit.__version__)"
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demand-forecast-kit-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  python-compatibility:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/work/parallel-i-release') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run core compatibility tests
        run: pytest
