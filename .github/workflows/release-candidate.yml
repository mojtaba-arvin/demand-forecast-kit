name: Release candidate

on:
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "src/**"
      - "tests/**"
      - "evals/**"
      - "docs/**"
      - ".github/workflows/release-candidate.yml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tooling and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev,stats]"
      - name: Run source quality gates
        run: |
          ruff check .
          ruff format --check .
          pyright
          pytest
          pytest tests/test_statistical_adapters.py --no-cov
          python evals/run_statistical_smoke.py
          if [ -f tests/test_api.py ]; then
            python -m pip install -e ".[api,api-test]"
            pytest tests/test_api.py --no-cov
          fi
          reuse lint
          pip-audit --skip-editable
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/demand-forecast-wheel
          /tmp/demand-forecast-wheel/bin/python -m pip install dist/*.whl
          /tmp/demand-forecast-wheel/bin/demand-forecast --help
          /tmp/demand-forecast-wheel/bin/demand-forecast-evaluate --help
          /tmp/demand-forecast-wheel/bin/python -c "import demand_forecast_kit; print(demand_forecast_kit.__version__)"
      - name: Install source distribution in isolated environment
        run: |
          python -m venv /tmp/demand-forecast-sdist
          /tmp/demand-forecast-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/demand-forecast-sdist/bin/demand-forecast --help
          /tmp/demand-forecast-sdist/bin/demand-forecast-evaluate --help
          /tmp/demand-forecast-sdist/bin/python -c "import demand_forecast_kit; print(demand_forecast_kit.__version__)"
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demand-forecast-kit-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run core compatibility tests
        run: pytest
