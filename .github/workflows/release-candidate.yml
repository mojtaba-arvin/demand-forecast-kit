name: Release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tooling and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m pip install -e ".[dev]"
      - name: Run source quality gates
        run: |
          ruff check .
          ruff format --check .
          pyright
          pytest
          reuse lint
          pip-audit --skip-editable
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/demand-forecast-release
          /tmp/demand-forecast-release/bin/python -m pip install --no-deps dist/*.whl
          /tmp/demand-forecast-release/bin/python -c "import demand_forecast_kit; print(demand_forecast_kit.__version__)"
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demand-forecast-kit-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30
